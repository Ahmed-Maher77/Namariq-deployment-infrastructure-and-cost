<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Namariq Design Options</title>
<style>
:root{--page:#eef1f3;--sheet:#fff;--ink:#17262f;--muted:#5d6b76;--rule:#d3dbe1;--accent:#0b6e4f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#14212b;--sheet:#1b2a35;--ink:#e7edf1;--muted:#9baab5;--rule:#2e3f4b;--accent:#4cc79a}}
:root[data-theme="dark"]{--page:#14212b;--sheet:#1b2a35;--ink:#e7edf1;--muted:#9baab5;--rule:#2e3f4b;--accent:#4cc79a}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1400px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:26px;margin:0 0 6px;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 20px;max-width:75ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:20px}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.head{padding:14px 16px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-bottom:1px solid var(--rule)}
.head h2{font-size:17px;margin:0}
.head p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.head a{flex:none;font-size:14px;font-weight:600;color:var(--accent);text-decoration:none;border:1px solid var(--rule);border-radius:6px;padding:6px 12px}
.head a:hover{border-color:var(--accent)}
.frame{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;background:var(--page)}
.frame iframe{position:absolute;top:0;left:0;width:1280px;height:960px;border:0;transform-origin:0 0;pointer-events:none}
.traits{margin:0;padding:12px 16px 16px 34px;font-size:13px;color:var(--muted)}
.traits li{margin:2px 0}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Pick a design for the cost calculator</h1>
  <p class="lead">The same page and the same numbers, styled with five public, open-source design systems and one original design by Antigravity, next to the current design. Each preview is a scaled-down live page. Open one to try it at full size, in light and dark mode.</p>
  <div class="grid" id="grid"></div>
</div>
<script>
const DESIGNS = [
  {id:"", name:"Current design", by:"Namariq costing sheet",
   traits:["Bricolage Grotesque headline with IBM Plex Sans","Ledger green, double-underlined grand total","Sentence with built-in choices"]},
  {id:"primer", name:"GitHub Primer", by:"github.com · MIT licence",
   traits:["System fonts, 14px, 6px corners","Segmented controls and grey header boxes","Green primary button, outlined labels"]},
  {id:"material", name:"Material Design 3", by:"Google · Apache 2.0 licence",
   traits:["Roboto, purple tonal palette","Filter chips, pill buttons, 12px filled cards","Outlined text fields"]},
  {id:"carbon", name:"IBM Carbon", by:"IBM · Apache 2.0 licence",
   traits:["IBM Plex Sans, square corners everywhere","Black header bar, content switcher","Grey data tables, 48px blue buttons"]},
  {id:"antd", name:"Ant Design", by:"Ant Group · MIT licence",
   traits:["System fonts, blue #1677ff","Segmented control, cards, coloured tags","Classic enterprise admin feel"]},
  {id:"shadcn", name:"shadcn/ui", by:"used by Vercel and many SaaS tools · MIT licence",
   traits:["Geist, zinc neutrals, black primary","Tabs list, rounded cards with soft shadow","Minimal, monochrome"]},
  {id:"agy", name:"Antigravity's own design", by:"created by agy with its frontend design skill",
   traits:["An original direction, not based on a company's brand","See the comment at the top of designs/agy.css"]},
];
const grid = document.getElementById("grid");
for(const d of DESIGNS){
  const url = "index.html" + (d.id ? "?design=" + d.id : "");
  const card = document.createElement("article"); card.className = "card";
  card.innerHTML = `<div class="head"><div><h2>${d.name}</h2><p>${d.by}</p></div><a href="${url}" target="_blank" rel="noopener">Open full page</a></div>
    <div class="frame"><iframe src="${url}" title="${d.name} preview" tabindex="-1"></iframe></div>
    <ul class="traits">${d.traits.map(t => `<li>${t}</li>`).join("")}</ul>`;
  grid.appendChild(card);
}
function fit(){ for(const f of document.querySelectorAll(".frame")){ const s = f.clientWidth / 1280; f.querySelector("iframe").style.transform = `scale(${s})`; } }
addEventListener("resize", fit); fit();
</script>
</body>
</html>
